<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess Overlay</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="../icons/icon48.png" alt="" width="28" height="28">
  <div class="title">
    <h1>Chess Overlay</h1>
    <span id="engineState" class="sub">Stockfish 19 · loading…</span>
  </div>
  <label class="switch" title="Enable / disable">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
  </label>
</header>

<section class="card status" id="statusCard">
  <div class="row between">
    <span class="chip" id="site">No board</span>
    <span class="muted" id="turnText"></span>
  </div>
  <div class="best">
    <div class="move" id="bestMove">—</div>
    <div class="meta">
      <span class="eval" id="evalText"></span>
      <span class="depth" id="depthText"></span>
    </div>
  </div>
  <div class="evalbar"><div class="fill" id="evalFill" style="width:50%"></div></div>
  <div class="hint" id="hint">Open a game or analysis board on Lichess or Chess.com.</div>
</section>

<section class="card">
  <div class="label">Analyze for</div>
  <div class="seg" id="side">
    <button data-v="me">Me</button>
    <button data-v="white">White</button>
    <button data-v="black">Black</button>
    <button data-v="both">Both</button>
  </div>

  <div class="row between label-row">
    <span class="label">Depth</span><span class="val" id="depthVal">18</span>
  </div>
  <input type="range" id="depth" min="6" max="30" step="1">

  <div class="row between label-row">
    <span class="label">Max think time</span><span class="val" id="movetimeVal">3.0 s</span>
  </div>
  <input type="range" id="movetime" min="0.5" max="15" step="0.5">

  <div class="toggles">
    <label class="toggle"><span>Show expected reply</span><input type="checkbox" id="showReply"><span class="slider small"></span></label>
    <label class="toggle"><span>Show eval badge</span><input type="checkbox" id="showEval"><span class="slider small"></span></label>
    <label class="toggle"><span>Arrow colour</span><input type="color" id="arrowColor"></label>
  </div>
</section>

<footer>
  <button id="reanalyze" class="btn">Re-analyze</button>
  <span class="warn">Analysis &amp; bot games only — engine use in rated games is banned.</span>
</footer>
<script src="popup.js"></script>
</body>
</html>
